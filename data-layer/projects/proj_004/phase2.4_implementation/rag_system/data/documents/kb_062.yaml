title: "《无限暖暖》GDC 分享：女性向服装游戏的全球化产品设计方法论"
category: game_design
content_type: few_shot_example
tags: ["无限暖暖", "叠纸", "女性向", "GDC", "全球化", "产品设计", "few_shot_example"]
