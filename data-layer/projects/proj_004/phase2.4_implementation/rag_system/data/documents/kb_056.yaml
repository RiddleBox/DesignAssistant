content: |
  【数据来源】分析师报告（PC Gamer 引用），2026-03-25
  【核心数字】《Slay the Spire 2》早期测试版上线后，日均活跃用户数（DAU）超过100万，被分析师认定为"卡牌构筑品类有史以来最佳商业表现"。
  【背景】前作《Slay the Spire》于2019年上线，是卡牌构筑品类的奠基作。《STS2》延续品类定位并加入多人功能，在早期测试阶段就达到上述数据。
  【对比参考】卡牌构筑品类历史 DAU 峰值：前作约 20-30 万，STS2 是其 3-5 倍。
  【引用价值】可直接引用的品类基准数字：2026年卡牌构筑品类头部产品 DAU 可达 100 万+，是评估同品类新产品市场天花板的重要参考锚点。
