title: "Pearl Abyss 承认用 genAI 创作资产却未披露——引发强制审计（2026年）"
category: tech_innovation
content_type: case_record
tags: ["Pearl Abyss", "Crimson Desert", "genAI", "信息披露", "审计", "版权风险", "case_record"]
metadata:
  source: "Game Developer，2026-03-25"
  confidence: 0.87
  last_updated: "2026-03-25"
content: |
  【主体】Pearl Abyss（《Crimson Desert》开发商）
  【动作】发布《Crimson Desert》时未披露游戏中部分资产使用了生成式 AI 创作。事件曝光后，Pearl Abyss 被迫承认，并宣布启动"全面审计"以识别和替换 AI 生成内容。
  【结果】首发 300 万销量的商业成功被 AI 使用未披露事件部分遮蔽。公司股价反应复杂（先跌后反弹）。审计承诺本身成为市场恢复信心的关键信号。
  【分析价值】游戏行业 AI 使用信息披露风险的首个高知名度案例：AI 生成内容不披露 ≠ 可以不披露，玩家和市场对透明度的要求正在提高。
  【引用结论】AI 资产使用的披露风险已被激活：Pearl Abyss 案例说明"悄悄用 AI"的策略在高关注度 AAA 产品上风险极高；信息披露和审计机制是 AI 内容使用的配套必要条件。
