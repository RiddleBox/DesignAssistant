title: "《无畏契约》手游获 App Store 年度游戏，库克现场体验——移动端竞技射击验证（2026年）"
industry: gaming
category: market_trend
content_type: case_record
tags: ["无畏契约", "Valorant", "拳头游戏", "Riot", "手游", "App Store", "移动端"]
metadata:
  source: "ChuApp 触乐，2026-03-26，Apple 北京开发者活动现场报道"
  confidence: 0.85
  last_updated: "2026-03-26"
content: |
  【主体】Riot Games（《无畏契约》开发商）/ Apple（App Store）
  【动作】Apple 将《无畏契约手游》评选为 App Store 年度游戏，Apple CEO Tim Cook 亲赴北京 Apple 开发者展示活动，现场体验该游戏并与开发者交流。
  【结果】App Store 年度游戏的背书是移动端竞技射击品类商业可行性的强力验证信号；Cook 亲身体验的公关事件在行业引发广泛关注。
  【分析价值】PC/主机端成熟竞技射击 IP 移植手游的成功路径验证：《无畏契约》从 PC 端核心玩法到手游的迁移，既保留了竞技深度，又适配了移动端操作，获得平台最高级别背书。
  【引用结论】竞技射击 IP 手游化的可行性已被最高级别平台认可：App Store 年度游戏 + Apple CEO 现身背书，是移动端竞技射击品类在 2026 年的标志性里程碑。
