title: "PUBG: Blindspot 失败案例——早期测试版关服（2026年）"
industry: gaming
category: market_trend
content_type: case_record
tags: ["PUBG", "Krafton", "Battle Royale", "早期测试失败", "关服"]
metadata:
  source: "Rock Paper Shotgun / PC Gamer / GameSpot 多方报道，2026-03-28"
  confidence: 0.90
  last_updated: "2026-03-28"
content: |
  【主体】Krafton（《PUBG》开发商）
  【动作】2026年2月5日上线《PUBG: Blindspot》早期测试版，定位为免费俯视角战术射击游戏，是 PUBG 品牌的衍生新品类尝试。
  【结果】上线不足2个月，Krafton 宣布关停服务器，《PUBG: Blindspot》正式下线。官方承认"未能找到可持续的玩家基础"。
  【分析价值】典型的新品类失败案例：依托成熟 IP 换品类（Battle Royale → 俯视角战术），未能留住既有玩家，也未吸引到目标新玩家。玩家留存率极低是核心失败指标。
  【引用结论】品牌 IP 迁移能力有限：已验证玩法上强品牌（如 PUBG）不能直接为新玩法背书，两个月内关服说明玩家对品牌的信任不能转化为对新品类的持续消费意愿。
