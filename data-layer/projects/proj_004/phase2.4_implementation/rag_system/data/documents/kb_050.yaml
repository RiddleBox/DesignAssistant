title: "沐瞳被沙特财团高价收购——移动 MOBA 出海成功后的并购退出路径（2026年）"
category: market_trend
content_type: case_record
tags: ["沐瞳", "Mobile Legends", "并购", "沙特", "出海", "MOBA", "估值"]
metadata:
  source: "ChuApp 触乐本周行业大事，2026-03-28，引用中国音数协数据"
  confidence: 0.80
  last_updated: "2026-03-28"
content: |
  【主体】沐瞳科技（上海，《Mobile Legends: Bang Bang》开发商）
  【动作】沐瞳被沙特阿拉伯财团以高价完成收购，具体金额未披露但被描述为"高价"。此前沐瞳依靠《Mobile Legends》在东南亚取得主导地位。
  【结果】收购完成，沐瞳成为沙特资本布局游戏行业的重要标的。《Mobile Legends》在东南亚日活跃用户数量级达数千万，是全球移动端 MOBA 市占率最高的游戏之一。
  【分析价值】中国游戏出海 + 战略并购的复合路径案例：通过在特定区域（东南亚）建立用户垄断，实现高溢价退出。沙特等中东资本大规模进入游戏行业的趋势性事件。
  【引用结论】移动游戏出海的并购价值兑现路径：区域垄断型产品（如东南亚 MOBA 第一）是最容易获得高溢价并购的资产类型；沙特资本密集入场游戏行业是 2024-2026 年可引用的结构性趋势。
