title: "沙特 Savvy Games Group 以60亿美元收购沐瞳——中东资本游戏投资最大单笔案例（2026年）"
category: market_trend
content_type: case_record
tags: ["沐瞳", "Moonton", "Savvy Games", "沙特", "收购", "60亿美元", "出海", "case_record"]
metadata:
  source: "Game Developer，2026-03-25，Savvy Games Group 官方公告"
  confidence: 0.92
  last_updated: "2026-03-25"
content: |
  【主体】沙特阿拉伯 Savvy Games Group（沙特公共投资基金 PIF 旗下游戏投资平台）
  【动作】以60亿美元收购沐瞳科技（Moonton Games），后者曾于2021年被字节跳动以40亿美元收购。
  【结果】本次收购溢价50%于字节跳动的购入价，是中东资本进入游戏行业迄今最大单笔投资。《Mobile Legends: Bang Bang》继续运营，沐瞳保持独立运作。
  【背景】字节跳动2021年以40亿收购沐瞳，五年内市值翻1.5倍退出。Savvy Games Group 在此之前已投资 ESL、FACEIT 等电竞平台。
  【引用结论】移动游戏区域垄断资产的溢价路径已被验证：东南亚 MOBA 第一 → 40亿买入 → 60亿卖出，5年IRR约8.4%；沙特 PIF 正通过 Savvy 系统性构建游戏行业战略资产。
