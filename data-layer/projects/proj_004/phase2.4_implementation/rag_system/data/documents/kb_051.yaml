title: "2026年2月中国游戏市场收入超330亿元——月度行业数据基准"
category: market_trend
content_type: market_data
tags: ["中国游戏市场", "月度收入", "2026年", "行业数据", "market_data"]
metadata:
  source: "中国音数协游戏工委《2026年2月中国游戏产业月度报告》，2026-03-16 发布"
  confidence: 0.95
  last_updated: "2026-03-28"
content: |
  【数据来源】中国音数协游戏工委，官方权威月度报告
  【核心数字】2026年2月，中国国内游戏市场收入超过330亿元人民币。
  【背景】该数据涵盖移动游戏、PC游戏、主机游戏等全品类国内市场流水，是行业最权威的月度参考基准之一。
  【同期对比参考】按历史规律，2月通常因春节效应处于全年相对高位，但同比增速需结合全年数据判断。
  【引用价值】可直接引用的行业基准数字：2026年2月中国游戏市场月收入 >330亿元，年化约 >3960亿元，是评估游戏项目市场天花板的重要参考锚点。
