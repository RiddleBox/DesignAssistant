content_type: case_record
tags: ["洛克王国", "IP重启", "手游", "开服数据", "iOS畅销"]
metadata:
  source: "ChuApp 触乐，2026-03-28，开服当日报道"
  confidence: 0.82
  last_updated: "2026-03-28"
content: |
  【主体】《洛克王国》IP 持有方（腾讯旗下）
  【动作】2026年3月26日，《洛克王国：世界》正式公测上线，这是经典儿童游戏 IP 的重启新作，公测前预约超过6000万。
  【结果】开服当日新进用户超过1500万，登顶 iOS 畅销榜。
  【分析价值】经典 IP 重启的正向数据样本：高预约转化（6000万预约 → 1500万首日用户，转化率约25%）说明老 IP 的情感资产在手游市场仍有强变现能力，但首日数据不等于长期留存。
  【引用结论】经典 IP 手游重启的市场启动效率显著优于新 IP：1500万首日新增是强信号，但核心验证指标应为次日/7日留存率，而非仅看开服峰值。
