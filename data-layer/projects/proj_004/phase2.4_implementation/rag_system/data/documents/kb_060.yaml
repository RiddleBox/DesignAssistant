content: |
  【主体】Bandai Namco（《铁拳8》开发商）
  【动作】《铁拳8》推送 Season 3 更新，内容包含角色平衡性大幅调整和新付费内容。
  【结果】更新上线后 Steam 评价跌至"多半差评"（Mostly Negative），是该系列评价最低点。核心玩家对平衡性变动和付费设计强烈抵制。
  【分析价值】成熟格斗游戏赛季更新的高风险区域：付费内容+大幅平衡改动的组合，在核心格斗游戏受众中触发了双重反弹，说明竞技格斗游戏的赛季商业化空间极为有限。
  【引用结论】格斗游戏赛季更新的商业化禁区：《铁拳8》案例验证了"核心竞技游戏 + 赛季付费内容 + 大规模平衡改动"的三重叠加风险——Steam 差评轰炸可在数日内对品牌造成长期损害。
