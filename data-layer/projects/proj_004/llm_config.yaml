# LLM 配置模板 — DesignAssistant
# 提交到仓库的版本不包含真实密钥。
# 如需本地使用，请复制为 llm_config.local.yaml 后填写，或直接使用环境变量。
# 各阶段可独立覆盖 api_key / base_url / model
# 未配置的字段自动继承 default

# ── 全局默认 ────────────────────────────────────────────────────────────────
default:
  provider: "anthropic"     # 提供方：anthropic | openai | gemini | custom
  api_key: ""               # 留空则从环境变量 ANTHROPIC_API_KEY 读取
  base_url: ""              # 留空则从环境变量 ANTHROPIC_BASE_URL 读取，再兜底 https://api.anthropic.com
  model: "claude-sonnet-4-6"
  max_tokens: 4096
  temperature: 0.0

# ── 各阶段独立配置（未填字段继承 default）──────────────────────────────────
# provider 可选值：
#   anthropic → 加 anthropic-version header，兼容 Anthropic 原生 / 中转代理
#   openai    → 标准 OpenAI 格式，仅 Authorization: Bearer
#   gemini    → Gemini OpenAI 兼容端点，仅 Authorization: Bearer
#   custom    → 不附加任何额外 header，base_url 自行控制
phases:
  "2.1":                    # 情报解码：追求稳定抽取，用中端模型省成本
    provider: "openai"
    model: "deepseek-chat"
    base_url: ""
    api_key: ""
    max_tokens: 4096

  "2.2":                    # 机会判断：需要更强推理，可换高端模型
    provider: "openai"
    model: "deepseek-chat"
    base_url: ""
    api_key: ""
    max_tokens: 4096

  "2.3":                    # 行动设计：三轮辩论输出较长，需要更大 token 空间
    provider: "anthropic"
    model: "claude-opus-4-5-20251101"
    max_tokens: 8192
    base_url: ""
    api_key: ""

  "2.4":                    # RAG 生成：轻量任务，可用低端模型
    provider: "anthropic"
    model: "claude-sonnet-4-6"

  "2.5":                    # 整合复盘：目前纯规则，暂不调用 LLM
    provider: "anthropic"
    model: "claude-sonnet-4-6"
