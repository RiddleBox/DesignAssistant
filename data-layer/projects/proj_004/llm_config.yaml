# LLM 配置文件 — DesignAssistant
# 各阶段可独立覆盖 api_key / base_url / model
# 未配置的字段自动继承 default

# ── 全局默认 ────────────────────────────────────────────────────────────────
default:
  api_key: ""               # 留空则从环境变量 ANTHROPIC_API_KEY 读取
  base_url: ""              # 留空则从环境变量 ANTHROPIC_BASE_URL 读取，再兜底 https://api.anthropic.com
  model: "claude-sonnet-4-6"
  max_tokens: 4096
  temperature: 0.0

# ── 各阶段独立配置（未填字段继承 default）──────────────────────────────────
phases:
  "2.1":                    # 情报解码：追求稳定抽取，用中端模型省成本
    model: "claude-sonnet-4-6"
    # api_key: ""           # 不填 → 用 default
    # base_url: ""          # 不填 → 用 default

  "2.2":                    # 机会判断：需要更强推理，可换高端模型
    # 【临时降级 2026-03-29】api123.icu 中转代理高负载下 opus 8192tokens 容易超时/空响应
    # 正式版切换稳定 API 后改回 claude-opus-4-5-20251101 + max_tokens: 8192
    model: "claude-sonnet-4-6"
    max_tokens: 4096
    base_url: "https://api123.icu/v1"
    # model: "claude-opus-4-5-20251101"  # 正式版模型，待稳定 API 后启用
    # max_tokens: 8192

  "2.3":                    # 行动设计：三轮辩论输出较长，需要更大 token 空间
    model: "claude-opus-4-5-20251101"
    max_tokens: 8192
    base_url: "https://api123.icu/v1"

  "2.4":                    # RAG 生成：轻量任务，可用低端模型
    model: "claude-sonnet-4-6"

  "2.5":                    # 整合复盘：目前纯规则，暂不调用 LLM
    model: "claude-sonnet-4-6"
